<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead time - TV</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111827; }
iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<iframe id="painel" title="Painel lead time"></iframe>
<script>
const paginas = ["painel_cd2.html", "painel_flv.html", "painel_pereciveis.html"];
let atual = 0;
const quadro = document.getElementById("painel");
function mostrar() {
  quadro.src = paginas[atual];
  atual = (atual + 1) % paginas.length;
}
mostrar();
setInterval(mostrar, 30000);
</script>
</body>
</html>
